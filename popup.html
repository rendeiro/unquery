<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --fg: #111; --muted: #888; --line: #e5e5e5; --hover: #f3f3f3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #eee; --muted: #777; --line: #2a2a2a; --hover: #222; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 280px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  header, section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .muted { color: var(--muted); }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; width: 100%; }
  button:hover { background: var(--hover); }
  #site { margin-bottom: 8px; word-break: break-all; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 200px; overflow-y: auto; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
  li button { width: auto; border: 0; padding: 0 6px; color: var(--muted); }
  form { display: flex; gap: 6px; margin-top: 8px; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  form button { width: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <span>Unquery</span>
  </header>
  <section id="current" hidden>
    <div id="site"></div>
    <button id="toggle"></button>
  </section>
  <section>
    <div class="muted">Exceptions (queries kept)</div>
    <ul id="list"></ul>
    <form id="add">
      <input type="text" id="domain" placeholder="example.com" autocomplete="off">
      <button>Add</button>
    </form>
  </section>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
